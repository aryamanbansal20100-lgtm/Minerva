<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Minerva">
  <!-- The Minerva mark at tab size: speech resolving into writing, read top to
       bottom. The full mark (web/src/components/MinervaMark.tsx) uses four
       lines; at 16px four turn to mush, so this keeps three and widens the
       spacing. Filled ground so the shape holds on a light or a dark tab. -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cf0"/>
      <stop offset="100%" stop-color="#c05fd6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#mg)"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 33 L31 20 L42 46 L54 22 L66 42 L82 33"/>
    <path d="M18 58 L36 51 L54 64 L82 57" opacity=".78"/>
    <path d="M18 80 L64 80" opacity=".92"/>
  </g>
</svg>
