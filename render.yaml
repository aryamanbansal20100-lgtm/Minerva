# Render blueprint — hosts the Python backend.
#
# Netlify serves static files only, so it cannot run this half. Render can, on
# its free tier, and reads this file automatically when you point it at the
# repository. Nothing here needs editing before the first deploy; the secrets
# are typed into Render's own dashboard, never into a file that gets committed.

services:
  - type: web
    name: minerva-api
    runtime: python
    plan: free
    # Standard library only — there is genuinely nothing to install. The upgrade
    # keeps pip itself current so the build step does not warn.
    # Nothing to install — the server is standard library only. But the
    # build step still needs requirements.txt to exist for Render to
    # recognise a Python project at all.
    buildCommand: "pip install -r requirements.txt"
    # EVIE_NO_RELOAD: the file-watcher that restarts on code changes is for
    # local development. On a host the code never changes under the process, and
    # a watcher would just burn a worker.
    # EVIE_NO_RELOAD is set in envVars below rather than inlined here, so
    # nothing depends on how the platform parses the command string.
    startCommand: "python run.py"
    healthCheckPath: /
    envVars:
      # --- you set these in the Render dashboard, marked sync:false so they
      # --- are never written into this file or the repository.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional third provider. Free at build.nvidia.com -- 40 requests a
      # minute, no card. Only used when Groq fails, which it does often enough
      # mid-lesson to matter. Leave unset and nothing changes.
      - key: NVIDIA_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # NOT a secret: the project id is already visible in the browser bundle
      # (web/src/lib/firebase.ts) because Firebase needs it client-side. It is
      # a value rather than sync:false precisely so it cannot be forgotten —
      # when it was missing, cloud.enabled() returned False and the server
      # mirrored nothing to Firestore while reporting no error at all. Every
      # redeploy then wiped the ephemeral disk and the account looked factory
      # reset. Must match projectId in web/src/lib/firebase.ts.
      - key: FIREBASE_PROJECT
        value: "note-ta"
      # The Netlify address of the front end, so CORS lets it through.
      # e.g. https://minerva.netlify.app
      - key: EVIE_ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EVIE_NO_RELOAD
        value: "1"

    # A free instance has an ephemeral filesystem: every redeploy wipes the
    # per-user SQLite files under data/. Notes survive because they mirror to
    # Firestore, but that restore path must be tested before real students rely
    # on it. A paid disk removes the risk entirely:
    #
    # disk:
    #   name: minerva-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

  # ---------------------------------------------------------------------
  # The front end, as a static site. Free, and — unlike a free web service —
  # it never spins down, so the app appears instantly instead of showing
  # Render's cold-start screen for a minute while the Python process wakes.
  # The API behind it still sleeps; the difference is that the interface is
  # already on screen while that happens, rather than a blank page.
  #
  # This is what Netlify was doing. Keeping it on Render means one dashboard,
  # one repo connection, and no second provider to configure or run out of.
  # ---------------------------------------------------------------------
  - type: web
    name: minerva
    runtime: static
    plan: free
    # Documented monorepo form: build inside web/, publish from the repo root.
    buildCommand: "cd web && npm ci && npm run build"
    staticPublishPath: ./web/dist
    routes:
      # The app routes on the hash (#/notes), so every request is for
      # index.html. Without this a refresh on a deep link 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints these filenames, so a changed file is a changed URL
      # and a long cache is safe.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Security headers. A static host serves these itself -- the Python
      # server's copies never reach a page it did not serve, so leaving them
      # out here would protect the API and not the app anyone actually loads.
      # Keep in step with security_policy() in server/main.py.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.google.com; media-src 'self' blob:; connect-src 'self' blob: https://*.googleapis.com https://*.google.com https://*.onrender.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://*.google.com; worker-src 'self' blob:"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "microphone=(self), camera=(self), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
