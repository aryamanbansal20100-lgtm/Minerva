<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Minerva">
  <!-- The Minerva mark at tab size: a prism splitting one beam into an ordered
       spectrum. The full mark (web/src/components/MinervaMark.tsx) fans five
       bands; at 16px five separate strokes turn to mush, so this keeps four and
       thickens them. Filled ground so the shape holds against a light or a dark
       tab strip. -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cf0"/>
      <stop offset="100%" stop-color="#c05fd6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#mg)"/>
  <!-- the beam arriving -->
  <path d="M8 46 L30 46" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <!-- the prism -->
  <path d="M46 24 L70 70 L22 70 Z" fill="#fff" fill-opacity=".16"
        stroke="#fff" stroke-width="6.5" stroke-linejoin="round"/>
  <!-- the spectrum leaving, cool to warm -->
  <g stroke-width="5.5" stroke-linecap="round" fill="none">
    <path d="M58 52 L92 34" stroke="#c4b5fd"/>
    <path d="M58 52 L94 45" stroke="#a5b4fc"/>
    <path d="M58 52 L94 57" stroke="#7dd3fc"/>
    <path d="M58 52 L90 69" stroke="#fcd34d"/>
  </g>
</svg>
